<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <filter id="paper" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.105" numOctaves="4" seed="27" result="longFibres"/>
      <feTurbulence type="turbulence" baseFrequency="0.055 0.18" numOctaves="2" seed="9" result="shortFibres"/>
      <feBlend in="longFibres" in2="shortFibres" mode="multiply" result="fibres"/>
      <feColorMatrix in="fibres" type="saturate" values="0" result="mono"/>
      <feGaussianBlur in="mono" stdDeviation="0.28" result="soft"/>
      <feDiffuseLighting in="soft" surfaceScale="5.1" diffuseConstant="1.18" lighting-color="#fff8eb" result="light">
        <feDistantLight azimuth="225" elevation="38"/>
      </feDiffuseLighting>
      <feSpecularLighting in="soft" surfaceScale="4.2" specularConstant="0.58" specularExponent="22" lighting-color="#fffdf6" result="shine">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feBlend in="light" in2="shine" mode="screen" result="relief"/>
      <feComponentTransfer in="relief">
        <feFuncR type="linear" slope="0.58" intercept="0.36"/>
        <feFuncG type="linear" slope="0.55" intercept="0.34"/>
        <feFuncB type="linear" slope="0.50" intercept="0.31"/>
        <feFuncA type="table" tableValues="0 .82"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="360" height="360" fill="#efe4d3"/>
  <rect x="-12" y="-12" width="384" height="384" filter="url(#paper)" opacity=".92"/>
</svg>
